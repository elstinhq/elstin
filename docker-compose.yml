# elstin — local single-process stack.
#
# One service: the app (FastAPI settings UI/API + the daemon poll loop running
# as a background task inside the same process — no control-plane/worker split,
# that's a fleet-scale concern, irrelevant here). Its database is one SQLite
# file on the data volume; the app creates and migrates it before it serves.
#
# The only env var the app reads is DATABASE_URL, wired below to that file —
# every other setting (JIRA/GitHub/LLM credentials, gate toggles) is entered
# through the settings UI at http://localhost:8000/settings and stored in the
# database. There is no .env file to create.
#
# The UI (settings-ui/vendor/) is built inside the image by the Dockerfile's
# ui-build stage — see ui-src/README.md if you've changed ui-src/ and need to
# rebuild it with `docker compose up --build`.
#
# Usage:
#   docker compose up
#   open http://localhost:8000/settings

services:
  app:
    build: .
    command: ["uvicorn", "elstin.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: sqlite:////data/elstin.db
    ports:
      - "${ELSTIN_APP_PORT:-8000}:8000"
    volumes:
      # /data itself, not only the two directories below it: the database
      # and its LangGraph checkpoints (/data/elstin.db, /data/elstin.checkpoints.db),
      # the dev loop's pre-edit baselines (/data/baselines, what
      # roll_back_file_tool restores from) and downloaded JIRA
      # attachments all live directly under it, and without a volume they
      # sit in the container's writable layer — gone the moment the
      # container is recreated, which is every `scripts/elstin.sh up`.
      - elstin-data:/data
      - elstin-repos:/data/repos
      - elstin-cloned-repos:/data/cloned-repos
      # To ATTACH a repo that already lives on your machine instead of
      # cloning it by URL (Folders -> + -> "Attach a folder"), mount it here
      # and attach the path INSIDE the container. The container sees nothing
      # of the host filesystem otherwise. For example:
      #   - /Users/you/code/shop-app:/workspace/shop-app
      # then attach /workspace/shop-app. A folder holding several repos works
      # too (mount it, attach it, pick which repos). Running elstin directly on
      # the host (scripts/start-local.sh) needs none of this — attach the host
      # path as is.

volumes:
  elstin-data:
  elstin-repos:
  elstin-cloned-repos:

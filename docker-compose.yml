# elstin — local single-process stack.
#
# Two services: Postgres, and the app (FastAPI settings UI/API + the daemon
# poll loop running as a background task inside the same process — no
# control-plane/worker split, that's a fleet-scale concern, irrelevant
# here). Alembic runs as a one-shot init container before the app starts.
#
# The ONLY env var the app needs is DATABASE_URL, wired below by service
# name — every other setting (JIRA/GitHub/LLM credentials, gate toggles) is
# entered through the settings UI at http://localhost:8000/settings and
# stored in Postgres. There is no .env file to create.
#
# The UI (settings-ui/vendor/) is a pre-built asset — see the Dockerfile's
# comment and ui-src/README.md if you've changed settings-ui/*.html or
# ui-src/entry.js and need to rebuild it before `docker compose up --build`.
#
# Usage:
#   docker compose up
#   open http://localhost:8000/settings

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elstin
      POSTGRES_PASSWORD: elstin
      POSTGRES_DB: elstin
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "elstin"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - elstin-pgdata:/var/lib/postgresql/data
    ports:
      - "${ELSTIN_PG_PORT:-5433}:5432"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://elstin:elstin@postgres:5432/elstin
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    command: ["uvicorn", "elstin.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://elstin:elstin@postgres:5432/elstin
    ports:
      - "${ELSTIN_APP_PORT:-8000}:8000"
    volumes:
      # /data itself, not only the two directories below it: the dev
      # loop's pre-edit baselines (/data/baselines, what
      # roll_back_file_tool restores from) and downloaded JIRA
      # attachments live directly under it, and without a volume they
      # sit in the container's writable layer — gone the moment the
      # container is recreated, which is every `scripts/elstin.sh up`.
      - elstin-data:/data
      - elstin-repos:/data/repos
      - elstin-cloned-repos:/data/cloned-repos
      # To ATTACH a repo that already lives on your machine instead of
      # cloning it by URL (Folders -> + -> "Attach a folder"), mount it here
      # and attach the path INSIDE the container. The container sees nothing
      # of the host filesystem otherwise. For example:
      #   - /Users/you/code/shop-app:/workspace/shop-app
      # then attach /workspace/shop-app. A folder holding several repos works
      # too (mount it, attach it, pick which repos). Running elstin directly on
      # the host (uvicorn) needs none of this — attach the host path as is.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  elstin-pgdata:
  elstin-data:
  elstin-repos:
  elstin-cloned-repos:
